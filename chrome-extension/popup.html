<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      color: #0a0a0a;
    }
    h1 { font-size: 14px; margin: 0 0 12px 0; font-weight: 600; }
    p { font-size: 12px; color: #737373; margin: 0 0 16px 0; line-height: 1.5; }
    button {
      width: 100%;
      padding: 10px;
      background: #0a0a0a;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover { background: #262626; }
  </style>
</head>
<body>
  <h1>Rewrite Clipper</h1>
  <p>Highlight text on any website, right-click, and select <strong>Rewrite with AI</strong>.</p>
  <button id="openApp">Open Rewrite Workspace</button>

  <script src="popup.js"></script>
</body>
</html>
